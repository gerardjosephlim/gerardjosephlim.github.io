<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron Beam Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app-container">
        <canvas id="simulationCanvas"></canvas>

        <div class="ui-overlay">
            <div class="header liquid-glass">
                <h1>Electron Beam Simulator</h1>
                <p>Simulate electron beam in magnetic and electric fields</p>
                <p><i>Dr. Gerard Joseph Lim</i></p>
            </div>
        </div>

        <div class="controls-panel">
            <h1>Electron Beam</h1>

            <div class="control-group">
                <h2>Beam Source</h2>
                <label>
                    Particles/Second
                    <span id="emission-val" class="value-display">50%</span>
                </label>
                <input type="range" id="emissionRate" min="0" max="100" value="50">

                <label>
                    Energy (eV)
                    <span id="energy-val" class="value-display">100</span>
                </label>
                <input type="range" id="beamEnergy" min="10" max="500" value="100">

                <label>
                    Spread
                    <span id="spread-val" class="value-display">0.1</span>
                </label>
                <input type="range" id="beamSpread" min="0" max="1.0" step="0.05" value="0.1">

                <!-- Added Clear Button -->
                <button id="clear-particles-btn" style="margin-top: 8px;">Clear Particles</button>
            </div>

            <div class="control-group">
                <h2>Accelerator</h2>
                <label>
                    Plate Voltage (kV)
                    <span id="voltage-val" class="value-display">2.0</span>
                </label>
                <input type="range" id="plateVoltage" min="0" max="10.0" step="0.1" value="2.0">
            </div>

            <div class="control-group">
                <h2>Magnetic Field Sections</h2>
                <button id="add-magnet-btn">+ Add Field Region</button>
                <div id="magnet-customizer"
                    style="display: none; margin-top: 10px; border-top: 1px solid var(--glass-border); padding-top: 10px;">
                    <label>Selected Region B-Field</label>
                    <label>
                        Strength (mT)
                        <span id="b-field-val" class="value-display">0</span>
                    </label>
                    <input type="range" id="bFieldStrength" min="-500" max="500" value="0">
                    <button id="reset-magnet-size-btn" style="width: 100%; margin-top: 5px;">Reset Size</button>
                    <button id="delete-magnet-btn" class="danger" style="width: 100%; margin-top: 5px;">Remove
                        Region</button>
                </div>
            </div>

            <div class="control-group">
                <h2>Electric Field Sections</h2>
                <button id="add-electric-btn">+ Add E-Field Plate</button>
                <div id="electric-customizer"
                    style="display: none; margin-top: 10px; border-top: 1px solid var(--glass-border); padding-top: 10px;">
                    <label>Selected E-Field</label>

                    <label>
                        Voltage (kV)
                        <span id="e-voltage-val" class="value-display">0</span>
                    </label>
                    <input type="range" id="eFieldVoltage" min="-5" max="5" step="0.1" value="0">

                    <label>
                        Gap Size
                        <span id="e-gap-val" class="value-display">100</span>
                    </label>
                    <input type="range" id="eFieldGap" min="50" max="300" step="10" value="100">

                    <button id="delete-electric-btn" class="danger" style="width: 100%; margin-top: 5px;">Remove
                        Plate</button>
                </div>
            </div>
        </div>


    </div>

    <script src="script.js"></script>
</body>

</html>
