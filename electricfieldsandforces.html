<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Field Simulation</title>
    <link rel="stylesheet" href="electricfieldsandforces.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div id="simulation-container">
        <canvas id="fieldCanvas"></canvas>

        <div class="ui-overlay">
            <div class="header liquid-glass">
                <h1>Electric Charges and Field</h1>
                <p>Visualize vector fields from point charges</p>
                <p><i>Dr. Gerard Joseph Lim</i></p>
            </div>



            <!-- Trash Bin -->
            <div id="trash-bin" class="trash-bin">
                🗑️
                <span class="trash-hint">Drop charge into trash to remove</span>
            </div>

            <div class="controls-wrapper">
                <div class="controls liquid-glass" id="main-controls">
                    <button id="add-charge" class="btn btn-primary">
                        <span style="font-size: 1.2em;">+</span> Add Charged Particle
                    </button>

                    <div class="divider"></div>

                    <button id="play-pause" class="btn btn-success">
                        <span id="play-icon">▶</span> Play
                    </button>

                    <div style="display: flex; align-items: center; gap: 8px; margin-left: 8px;">
                        <label class="toggle-label" style="font-size: 0.75rem; white-space: nowrap;">Speed</label>
                        <input type="range" id="sim-speed" min="0.01" max="0.5" step="0.01" value="0.05"
                            style="width: 80px;">
                    </div>

                    <div class="divider"></div>

                    <div class="toggles-group">
                        <div style="display: flex; flex-direction: row; gap: 4px; align-items: center;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <label class="switch">
                                    <input type="checkbox" id="viz-mode-toggle">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label" id="viz-label">FIELD MAGNITUDE</span>
                            </div>

                            <!-- Grid Unit Selection -->
                            <div
                                style="display: flex; align-items: center; gap: 8px; margin-left: 16px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 16px;">
                                <label style="font-size: 0.9rem; color: var(--text-muted);">Grid Unit:</label>
                                <select id="grid-unit"
                                    style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 8px; border-radius: 4px; font-family: 'Inter', sans-serif;">
                                    <option value="mm" selected>mm</option>
                                    <option value="cm">cm</option>
                                    <option value="m">m</option>
                                </select>
                            </div>

                            <div
                                style="display: flex; align-items: center; gap: 8px; margin-left: 16px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 16px;">
                                <label class="switch">
                                    <input type="checkbox" id="force-mode-toggle">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">Show Forces</span>
                            </div>

                            <div
                                style="display: flex; align-items: center; gap: 8px; margin-left: 16px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 16px;">
                                <label class="switch">
                                    <input type="checkbox" id="axes-toggle">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">Axes</span>
                            </div>

                            <div
                                style="display: flex; align-items: center; gap: 8px; margin-left: 16px; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 16px;">
                                <label class="switch">
                                    <input type="checkbox" id="equipotential-toggle">
                                    <span class="slider"></span>
                                </label>
                                <span class="toggle-label">Equipotentials</span>
                            </div>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <button id="reset-btn" class="btn btn-danger">
                        Reset
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Left Panel - Distance Table -->
    <div id="distance-panel" class="charge-panel liquid-glass"
        style="left: 20px; right: auto; top: 180px; transform: none; display: none;">
        <div class="panel-header">
            <span class="panel-title">Component Distances</span>
        </div>
        <table id="distance-table"
            style="width:100%; color: white; font-size: 0.9em; text-align: left; border-collapse: collapse;">
            <thead>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
                    <th style="padding: 4px;">Charge</th>
                    <th style="padding: 4px;">dx</th>
                    <th style="padding: 4px;">dy</th>
                    <th style="padding: 4px;">Dist</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>

    <!-- Right Panel - Selected Charge Properties -->
    <div id="charge-panel" class="charge-panel liquid-glass">
        <div class="panel-header">
            <span class="panel-title">Charge Properties</span>
            <button id="close-panel" class="close-btn">&times;</button>
        </div>

        <div class="control-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label>Charge Magnitude</label>
                <select id="charge-unit"
                    style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-family: 'Inter', sans-serif;">
                    <option value="nC">nC</option>
                    <option value="uC" selected>μC</option>
                    <option value="mC">mC</option>
                    <option value="C">C</option>
                </select>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="range" id="charge-slider" min="-10" max="10" step="0.5" value="0" style="flex: 1;">
                <input type="number" id="charge-number" min="-10" max="10" step="0.5" value="0">
            </div>
        </div>

        <div class="control-group">
            <label>Position (Grid Units)</label>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="display: flex; align-items: center; gap: 6px; flex: 1;">
                    <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold;">X</span>
                    <input type="number" id="pos-x" step="0.1" style="width: 100%; min-width: 0;">
                </div>
                <div style="display: flex; align-items: center; gap: 6px; flex: 1;">
                    <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold;">Y</span>
                    <input type="number" id="pos-y" step="0.1" style="width: 100%; min-width: 0;">
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>Electric Potential Energy</label>
            <div
                style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                <span style="font-size: 0.8rem; color: var(--text-muted);">U =</span>
                <span id="energy-val" style="font-family: 'Inter', monospace; font-weight: 600; color: #fbbf24;">0.00
                    J</span>
            </div>
        </div>

        <div id="force-display-group" class="control-group" style="display: none;">
            <label>Net Force Components</label>
            <div
                style="display: flex; justify-content: space-between; gap: 8px; font-family: monospace; font-size: 0.9rem; color: var(--text-muted);">
                <div>Fx: <span id="force-x" style="color: var(--text-main);">0.0</span></div>
                <div>Fy: <span id="force-y" style="color: var(--text-main);">0.0</span></div>
            </div>
        </div>

        <div class="control-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>State</label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="state-label" class="toggle-label" style="font-size: 0.75rem;">Static</span>
                    <label class="switch">
                        <input type="checkbox" id="fixed-dynamic-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>


    </div>
    </div>

    <script src="electricfieldsandforces.js"></script>
</body>

</html>
